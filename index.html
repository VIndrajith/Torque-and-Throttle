    <script>
      // Suppress benign Vite dev server WebSocket/HMR reconnection messages in cloud preview
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.stack || '' + event.reason)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('wss:') !== -1)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || (event.error && event.error.message) || '' + event)) || '';
        if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('failed to connect') !== -1)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
